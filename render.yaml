# Render Blueprint: free web service built from the Dockerfile. Set PUBLIC_BASE_URL to the final
# https://<name>.onrender.com origin BEFORE registering onchain (it is part of the manifest hash).
services:
  - type: web
    name: chainlead
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: X402_MODE
        value: facilitator
      - key: X402_FACILITATOR_URL
        value: https://facilitator.payai.network
      - key: X402_PAY_TO
        value: "0x93714D5970f511Ac22f0E5635D3fBF538f717cd4"
      - key: TOOL_CREATOR_ADDRESS
        value: "0x93714D5970f511Ac22f0E5635D3fBF538f717cd4"
      - key: CHAINLEAD_PRICE_USDC
        value: "0.50"
      - key: GITHUB_TOKEN
        sync: false
